<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scene 6 — Closing</title>
<style>
  :root {
    --bg: #0a0f1e;
    --ink: #e8ecf5;
    --muted: #8691a8;
    --accent: #ff6b4a;
    --rule: #1f2a44;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", "Helvetica Neue", sans-serif;
  }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden;
    background: var(--bg); color: var(--ink); font-family: var(--sans); }
  .frame { display: flex; flex-direction: column; justify-content: center; align-items: center;
    height: 100%; padding: 60px; text-align: center; box-sizing: border-box; }
  .eyebrow { font-size: 28px; color: var(--accent); letter-spacing: 0.18em;
    text-transform: uppercase; margin-bottom: 32px; }
  .h1 { font-size: 144px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 32px 0; line-height: 1.02; }
  .h1 b { color: var(--accent); }
  .tag { font-size: 40px; color: var(--muted); margin: 0 0 56px 0; max-width: 1400px; line-height: 1.35; }
  .url { font-family: var(--mono); font-size: 36px; background: var(--rule);
    padding: 20px 36px; border-radius: 10px; border: 1px solid #2a3858; color: var(--ink); }
  .url b { color: var(--accent); }
  .pills { display: flex; gap: 16px; margin-top: 48px; }
  .pill { font-family: var(--mono); font-size: 22px; background: #111833; color: var(--muted);
    padding: 10px 20px; border-radius: 6px; border: 1px solid var(--rule); }
</style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">#NEARHACKATHON</div>
    <h1 class="h1">Built at <b>NEAR HACKATHON</b>.</h1>
    <p class="tag">Shield · Mesh · Coach.<br>The thing that catches what pre-sign policy misses.</p>
    <div class="url">kajota-mesh.<b>vercel.app</b></div>
    <div class="pills">
      <span class="pill">8 settlements</span>
      <span class="pill">36 on-chain txs</span>
      <span class="pill">Arbitrum Sepolia · Robinhood Chain</span>
      <span class="pill">make replay-384</span>
    </div>
  </div>
</body>
</html>
