<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scene 5 — Live counter (placeholder for Mesh Singapore reuse)</title>
<style>
  :root { --bg: #0a0f1e; --ink: #e8ecf5; --muted: #8691a8; --accent: #4ade80; --rule: #1f2a44;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", sans-serif; }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px;
    background: var(--bg); color: var(--ink); font-family: var(--sans); }
  .frame { display: flex; flex-direction: column; justify-content: center; align-items: center;
    height: 100%; padding: 60px; text-align: center; box-sizing: border-box; }
  .label { font-size: 32px; color: var(--accent); letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 40px; }
  .h1 { font-size: 72px; font-weight: 700; margin: 0 0 24px 0; }
  .counters { display: flex; gap: 48px; margin: 40px 0; }
  .counter { background: #111833; border: 1px solid var(--rule); border-radius: 12px;
    padding: 36px 48px; }
  .counter .n { font-family: var(--mono); font-size: 96px; color: var(--accent); font-weight: 800; }
  .counter .k { font-size: 24px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .url { font-family: var(--mono); font-size: 36px; color: var(--ink);
    margin-top: 24px; background: var(--rule); padding: 16px 32px; border-radius: 8px; }
  .url b { color: var(--accent); }
  .path { font-family: var(--mono); font-size: 20px; color: var(--muted);
    background: var(--rule); padding: 14px 24px; border-radius: 6px; margin-top: 40px;
    border: 1px solid #2a3858; }
  .path b { color: var(--accent); }
</style>
</head>
<body>
  <div class="frame">
    <div class="label">Scene 5 · Live counter · to be reused from Mesh Singapore</div>
    <h1 class="h1">Clone the repo, see Shield halt.</h1>
    <div class="counters">
      <div class="counter"><div class="n">8</div><div class="k">settlements</div></div>
      <div class="counter"><div class="n">36</div><div class="k">on-chain txs</div></div>
      <div class="counter"><div class="n">2</div><div class="k">chains</div></div>
    </div>
    <div class="url">kajota-mesh.<b>vercel.app</b></div>
    <div class="path"><b>Replace with Mesh Singapore's existing live-counter scene</b></div>
  </div>
</body>
</html>
